<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Animated Neon Wave Gradient -->
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#38bdf8;#818cf8;#c084fc;#38bdf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.9">
        <animate attributeName="stop-color" values="#818cf8;#c084fc;#38bdf8;#818cf8" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.8">
        <animate attributeName="stop-color" values="#c084fc;#38bdf8;#818cf8;#c084fc" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.75" />
    </linearGradient>

    <!-- Tech Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25" />
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.3" />
    </pattern>

    <!-- Subtle Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 50px;
      letter-spacing: -0.5px;
      fill: #ffffff;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 19px;
      fill: #94a3b8;
      letter-spacing: 0.3px;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .pill-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.8px;
      text-transform: uppercase;
    }
  </style>

  <!-- 1. Background Canvas -->
  <rect width="1200" height="380" fill="url(#bgGradient)" rx="16" />
  <rect width="1200" height="380" fill="url(#grid)" rx="16" />

  <!-- 2. Ambient Floating Dynamic Orbs (Behind content) -->
  <g opacity="0.35">
    <circle cx="180" cy="100" r="140" fill="#0284c7" filter="url(#glow)">
      <animate attributeName="cy" values="100;130;100" dur="9s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.25;0.45;0.25" dur="6s" repeatCount="indefinite" />
    </circle>
    <circle cx="1020" cy="260" r="160" fill="#7c3aed" filter="url(#glow)">
      <animate attributeName="cy" values="260;230;260" dur="10s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.25;0.45;0.25" dur="7s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- 3. Dynamic Ambient Network Lines (Background) -->
  <g stroke="#38bdf8" stroke-width="1" opacity="0.2">
    <line x1="50" y1="310" x2="1150" y2="310" stroke-dasharray="6,6">
      <animate attributeName="stroke-dashoffset" values="0;24" dur="4s" repeatCount="indefinite" />
    </line>
    <line x1="50" y1="70" x2="1150" y2="70" stroke-dasharray="6,6">
      <animate attributeName="stroke-dashoffset" values="24;0" dur="4s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- 4. Floating Tech Status Badges (Left & Right Sides - Kept away from Center Title) -->
  <!-- Top Left Badge -->
  <g transform="translate(60, 48)">
    <rect width="170" height="34" rx="17" fill="url(#cardBg)" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="18" cy="17" r="4" fill="#10b981">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="22" class="badge-text">ITIL v4 Aligned</text>
  </g>

  <!-- Top Right Badge -->
  <g transform="translate(960, 48)">
    <rect width="180" height="34" rx="17" fill="url(#cardBg)" stroke="#c084fc" stroke-width="1" stroke-opacity="0.5" />
    <circle cx="18" cy="17" r="4" fill="#a855f7">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.5s" repeatCount="indefinite" />
    </circle>
    <text x="32" y="22" class="badge-text">AI Agentic Service</text>
  </g>

  <!-- 5. Foreground Content Container (Guaranteed Clear Foreground) -->
  <g id="foreground-content">
    <!-- Category Pill Tag -->
    <g transform="translate(485, 82)">
      <rect width="230" height="28" rx="14" fill="#1e293b" stroke="url(#neonGlow)" stroke-width="1.5" />
      <text x="115" y="18" text-anchor="middle" class="pill-text" fill="#38bdf8">Enterprise ITSM Ecosystem</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="165" text-anchor="middle" class="title-text">
      Awesome <tspan fill="url(#neonGlow)">IT Service Office</tspan>
    </text>

    <!-- Animated Accent Line -->
    <rect x="420" y="188" width="360" height="3" rx="1.5" fill="url(#neonGlow)">
      <animate attributeName="width" values="300;380;300" dur="4s" repeatCount="indefinite" />
      <animate attributeName="x" values="450;410;450" dur="4s" repeatCount="indefinite" />
    </rect>

    <!-- Subtitle -->
    <text x="600" y="228" text-anchor="middle" class="subtitle-text">
      Curated Directory of Enterprise SaaS &amp; Open-Source Service Desk, CMDB &amp; Help Desk Solutions
    </text>

    <!-- Interactive / Status Pills in Bottom Center (Spaced cleanly below subtitle) -->
    <g transform="translate(230, 268)">
      <!-- Item 1 -->
      <g transform="translate(0, 0)">
        <rect width="165" height="36" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="82" y="22" text-anchor="middle" class="badge-text" fill="#f8fafc">🚨 Incident Mgmt</text>
      </g>
      <!-- Item 2 -->
      <g transform="translate(185, 0)">
        <rect width="170" height="36" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="85" y="22" text-anchor="middle" class="badge-text" fill="#f8fafc">📦 Service Catalog</text>
      </g>
      <!-- Item 3 -->
      <g transform="translate(375, 0)">
        <rect width="175" height="36" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="87" y="22" text-anchor="middle" class="badge-text" fill="#f8fafc">🗄️ CMDB &amp; Assets</text>
      </g>
      <!-- Item 4 -->
      <g transform="translate(570, 0)">
        <rect width="170" height="36" rx="8" fill="#1e293b" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
        <text x="85" y="22" text-anchor="middle" class="badge-text" fill="#f8fafc">🤖 AI Agent Assist</text>
      </g>
    </g>
  </g>

  <!-- 6. Bottom Border Subtle Lightbar -->
  <rect x="0" y="376" width="1200" height="4" fill="url(#neonGlow)" />
</svg>
